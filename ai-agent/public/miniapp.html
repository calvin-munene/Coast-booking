<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b09">
  <title>Nvid AI OS</title>
  <link rel="stylesheet" href="/miniapp.css">
</head>
<body>
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>
  <div id="offline-banner" class="offline-banner" role="status" hidden>Connection lost. Nvid AI will reconnect automatically.</div>
  <div class="app-shell">
    <header class="topbar">
      <button id="back-button" class="icon-button" type="button" aria-label="Go back" hidden>‹</button>
      <a class="brand" href="/home" data-route="/home" aria-label="Nvid AI home">
        <img src="/telegram/profile-picture.png" alt="">
        <span><small>NVIDIA INTELLIGENCE</small><strong>Nvid AI</strong></span>
      </a>
      <span id="connection-state" class="connection-state"><i></i>SECURE</span>
    </header>

    <main id="app" class="page" tabindex="-1" aria-live="polite">
      <section class="loading-state">
        <span class="loader"></span>
        <p>Authenticating secure Telegram session…</p>
      </section>
    </main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Main navigation">
      <a href="/home" data-route="/home"><span>⌂</span>Home</a>
      <a href="/chat" data-route="/chat"><span>⌁</span>Chat</a>
      <a href="/models" data-route="/models"><span>◈</span>Models</a>
      <a href="/usage" data-route="/usage"><span>◎</span>Usage</a>
      <a href="/settings" data-route="/settings"><span>⚙</span>Settings</a>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/miniapp.js"></script>
</body>
</html>
