services:
  - type: web
    name: nvidia-multichannel-ai-agent
    runtime: node
    rootDir: ai-agent
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: meta/llama-3.1-70b-instruct
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_GLOBAL_REQUESTS_PER_HOUR
        value: "300"
      - key: NVIDIA_MAX_CONCURRENT_REQUESTS
        value: "4"
      - key: NVIDIA_CIRCUIT_FAILURE_THRESHOLD
        value: "5"
      - key: NVIDIA_CIRCUIT_COOLDOWN_SECONDS
        value: "60"
      - key: SYSTEM_PROMPT
        value: You are a helpful, concise AI assistant.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_STAR_SIGNING_SECRET
        generateValue: true
      - key: TELEGRAM_ADMIN_USER_ID
        sync: false
      - key: TELEGRAM_STARS_REQUIRED
        value: "true"
      - key: TELEGRAM_WEBAPP_MAX_AGE_SECONDS
        value: "300"
      - key: TELEGRAM_WEBAPP_SESSION_TTL_SECONDS
        value: "3600"
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: PUBLIC_URL
        value: https://nvidbot.onrender.com
      - key: TRUST_PROXY
        value: render
      - key: BOT_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: BOT_CREDENTIAL_KEY_VERSION
        value: v1
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: v23.0
